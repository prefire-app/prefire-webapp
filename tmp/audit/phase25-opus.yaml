findings:
  - id: fe-p25-001
    severity: P0
    category: security
    file: deploy.sh + CloudFront response-headers policy (absent)
    evidence: |
      Public SPA serves user-submitted geometry, third-party map tiles, and rendered
      markdown via `dangerouslySetInnerHTML`. NO Content-Security-Policy, X-Frame-Options,
      X-Content-Type-Options, Referrer-Policy, or HSTS configured on CloudFront or S3.
      Confirmed by absence in deploy.sh and lack of any vercel.json/_headers/cf-config.json.
    fix: |
      Attach an AWS Managed CloudFront Response Headers Policy (e.g. `Managed-SecurityHeadersPolicy`)
      to the distribution. Add a custom CSP via that policy with at minimum:
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https://api.mapbox.com https://*.basemaps.cartocdn.com https://tigerweb.geo.census.gov;
        connect-src 'self' https://wrtzl2rou1.execute-api.us-east-1.amazonaws.com https://api.mapbox.com https://tigerweb.geo.census.gov https://nominatim.openstreetmap.org https://prefire-data.s3.us-east-1.amazonaws.com;
        frame-ancestors 'none';
      Plus: X-Content-Type-Options nosniff; Referrer-Policy strict-origin-when-cross-origin;
      HSTS max-age=31536000 includeSubDomains preload.
    effort: small
    consolidates: [shard-config sec-001, shard-config cfg-012, shard-a11y a11y-014 (BlogPost dangerouslySetInnerHTML — CSP is the second line of defence)]

  - id: fe-p25-002
    severity: P0
    category: deps
    file: package.json (react-router-dom ^7.8.2)
    evidence: |
      npm audit reports `react-router` 7.0.0–7.14.2 has 3 high-severity CVEs:
        1. Unauth RCE via vendored turbo-stream TYPE_ERROR deserialization
        2. Same-origin open redirect via protocol-relative URL
        3. XSS in unstable RSC redirect via javascript: scheme
      Currently locked to ^7.8.2 → vulnerable. react-router-dom pulled in transitively.
    fix: |
      Bump to react-router-dom >=7.14.3. Run `npm install react-router-dom@^7.14.3`
      then `npm audit` to confirm 0 high. Re-run tests.
    effort: trivial
    consolidates: []

  - id: fe-p25-003
    severity: P0
    category: a11y
    file: ConfirmSubmitPopup.tsx, QuestionnairePopup.tsx, AddressSearchPopup.tsx (all three modals)
    evidence: |
      None of the three popup components set role="dialog", aria-modal, focus trap, focus
      restore on close, Escape-to-close, or a labelled aria-labelledby region. Keyboard and
      screen-reader users cannot use any of: address search, questionnaire flow, submit flow.
    fix: |
      Adopt one shared `<Modal>` wrapper (or use Radix Dialog) that:
        - renders role="dialog" aria-modal="true" aria-labelledby={titleId}
        - traps Tab/Shift+Tab via focus-trap-react or custom useEffect
        - listens for Escape and calls onClose
        - moves focus to first focusable on open; restores to trigger on close
        - renders a backdrop with role="presentation" + onClick close
      Reuse across all three popups (and NavBar mobile menu).
    effort: medium
    consolidates: [shard-a11y a11y-001, a11y-002, a11y-003, a11y-008]

  - id: fe-p25-004
    severity: P0
    category: contract
    file: src/components/ConfirmSubmitPopup.tsx:94-110
    evidence: |
      POST response (job_id, status) is discarded; error handler only console.errors.
      No polling of GET /jobs/{job_id}. User has zero visibility into the async pipeline.
    fix: |
      See cross-stack finding cs-001/cs-004/cs-005. Capture job_id, validate shape (Zod),
      add polling with backoff against GET /jobs/{job_id}, render success/failure to user.
    effort: medium
    consolidates: [cs-001, cs-004, cs-005, shard-mappingtool mt-012 (silent error pattern)]

  - id: fe-p25-005
    severity: P1
    category: deps
    file: package.json (5 unused deps + axios in wrong section + 1 undeclared)
    evidence: |
      - knip+depcheck both confirm 0 imports of: @googlemaps/js-api-loader, @react-google-maps/api,
        proj4, terra-draw, terra-draw-google-maps-adapter (5 deps, ~MBs of bundle if any leak through).
      - `axios` is in devDependencies but imported at runtime in ConfirmSubmitPopup.tsx — `npm ci --omit=dev`
        would break form submit.
      - `react-router` is imported in src/entry-server.tsx but only `react-router-dom` is declared
        (works today via transitive resolution; brittle to peer-dep changes).
    fix: |
      1. `npm uninstall @googlemaps/js-api-loader @react-google-maps/api proj4 terra-draw terra-draw-google-maps-adapter`
      2. Move axios out of devDependencies into dependencies (or switch to native fetch for the
         one call site — already a `fetch()` call in MappingTool, would unify network layer).
      3. `npm install react-router` to declare the transitive direct dep explicitly.
    effort: small
    consolidates: [shard-mappingtool mt-009, shard-config cfg-002, repo recon items 2 & 3]

  - id: fe-p25-006
    severity: P1
    category: correctness
    file: src/lib/constants.ts:2
    evidence: |
      `import.meta.env.NODE_ENV === "local"` — Vite does not populate NODE_ENV on
      import.meta.env. Local-dev branch is permanently false; local dev silently hits prod API.
      Also: VITE_API_URL is declared in .env.example but never read.
    fix: |
      ```ts
      export const API_URL = import.meta.env.VITE_API_URL
        ?? (import.meta.env.DEV ? "http://127.0.0.1:8000/send-geometry" : "<prod>");
      ```
      Update .env.example to mark VITE_API_URL as required for local dev.
    effort: trivial
    consolidates: [recon item 1, recon item 3, cs-006]

  - id: fe-p25-007
    severity: P1
    category: correctness
    file: src/components/MappingTool.tsx (multiple sites)
    evidence: |
      - mt-001: TIGERweb fetch composes a WHERE clause from FIPS codes via string interp;
        FIPS codes are constrained but still un-escaped (defensive concern).
      - mt-002/mt-003: TIGERweb + Nominatim fetches have no AbortController and no timeout.
      - mt-004: ZoomTracker double-fires zoom callback on mount (useMapEvents + useEffect).
      - mt-005: leaflet-draw handler closure captures stale onPolygonDrawn.
      - mt-006: walk() over GeoJSON has no shape validation; falls back silently on malformed input.
    fix: |
      Refactor MappingTool incrementally:
      (a) Replace handcrafted WHERE param with proper esri-rest query helper, or whitelist FIPS to digits.
      (b) Wrap all fetches in a small `apiFetch(url, { signal, timeoutMs })` helper using AbortController.
      (c) Remove the duplicate useEffect inside ZoomTracker.
      (d) Wrap onPolygonDrawn with useCallback in MappingTool body, type the draw event properly.
      (e) Validate GeoJSON shape before centroid math; surface error UI on bad input.
    effort: medium
    consolidates: [shard-mappingtool mt-001..mt-006, mt-011 (no polygon size cap)]

  - id: fe-p25-008
    severity: P1
    category: process
    file: .github/workflows (absent) + .husky (absent)
    evidence: |
      No CI workflow, no pre-commit hook. tsc, eslint, npm audit, and tests (no test suite at all,
      noted as a separate gap) run only when developer remembers locally.
    fix: |
      Add .github/workflows/ci.yml that runs on PR:
        - npm ci
        - npx tsc -b --noEmit
        - npm run lint
        - npm audit --audit-level=high
      Add husky + lint-staged for pre-commit eslint+tsc.
      Separately: this repo has zero tests. Adopt Vitest + React Testing Library for at least
      the submit flow (ConfirmSubmitPopup) and the modals.
    effort: medium
    consolidates: [shard-config cfg-004, cfg-005]

  - id: fe-p25-009
    severity: P1
    category: process
    file: eslint.config.js
    evidence: |
      ESLint config lacks eslint-plugin-jsx-a11y and eslint-plugin-security. Of the 16+ a11y
      findings in this audit, several (button-has-type, no-static-element-interactions,
      anchor-is-valid, label-has-associated-control) would have been auto-detected.
    fix: |
      `npm i -D eslint-plugin-jsx-a11y eslint-plugin-security` and extend the config.
      Treat new violations as warnings initially, then promote to errors after cleanup.
    effort: small
    consolidates: [shard-config cfg-004]

  - id: fe-p25-010
    severity: P1
    category: a11y
    file: BlogPost.tsx:24 (marked + dangerouslySetInnerHTML)
    evidence: |
      `const html = marked(post.content) as string` → injected via dangerouslySetInnerHTML.
      Today the source is in-tree markdown under src/blog/posts/, so trust is implicit.
      `marked` v18 does not sanitize by default — the moment content moves to a CMS, user
      submission, or comments, this becomes a critical XSS sink. The CSP from fe-p25-001
      is the only mitigation layer if that ever happens.
    fix: |
      Either:
      (a) Switch to react-markdown + rehype-sanitize (safer ergonomics), OR
      (b) Pipe marked output through DOMPurify before setting innerHTML.
      Even with in-tree source, add a unit test that confirms a `<script>` tag in markdown
      gets stripped, so the property is preserved as the codebase evolves.
    effort: small
    consolidates: [shard-a11y a11y-014, threat model: future CMS adoption]

  - id: fe-p25-011
    severity: P1
    category: correctness
    file: prerender.mjs:20, prerender.mjs:79
    evidence: |
      `esc` helper omits `&` and `'` — re-running on already-escaped content double-encodes
      `&amp;` → `&amp;amp;`. BASE_URL is hardcoded to https://prefire.online so any
      staging/preview deployment emits prod canonicals (SEO duplicate-content + wrong OG urls).
    fix: |
      Replace esc with an HTML escaper that handles `&` first then `<>"'`. Pull BASE_URL
      from `process.env.BASE_URL` with a default.
    effort: trivial
    consolidates: [shard-config sec-002, cfg-007]

  - id: fe-p25-012
    severity: P2
    category: deps
    file: package.json + tsconfig.app.json
    evidence: |
      Two map stacks in package.json (Leaflet + Google Maps + terra-draw) but only Leaflet
      used. Even after removing the unused deps, vite.config.ts manualChunks still names
      'leaflet' chunk which is fine but worth a comment explaining the chunking strategy
      (now justified, never documented).
    fix: |
      Add a comment to vite.config.ts manualChunks explaining the choice; remove
      `@tailwindcss/vite`'s implied tailwindcss false-positive in depcheck output.
      Re-run knip in CI after dep cleanup to confirm no regressions.
    effort: trivial
    consolidates: [shard-config cfg-018]

  - id: fe-p25-013
    severity: P2
    category: process
    file: tests/ (absent)
    evidence: |
      Repository has zero automated tests. No vitest config, no playwright, no jest.
      All recent findings (auth-gap-shaped UX, contract drift, modal accessibility) would
      have been catchable with a 200-line test suite.
    fix: |
      Bootstrap Vitest + @testing-library/react:
        - test that ConfirmSubmitPopup captures the job_id and shows status
        - test that modals trap focus and close on Escape (jest-axe optional)
        - test the GeoJSON walker on a known malformed input
      One PR can land the scaffold; subsequent PRs add coverage per touched feature.
    effort: medium
    consolidates: []

  - id: fe-p25-014
    severity: P2
    category: deps
    file: dist/ (already gitignored — verified)
    evidence: |
      `dist/` exists in working tree alongside source. Confirmed `.gitignore` excludes it,
      but multiple `npm run build` runs over time without `rm -rf dist` could leave stale
      pre-rendered HTML (per cfg-016). deploy.sh `aws s3 sync ... --delete` cleans S3 but
      not the local dist/.
    fix: |
      Add `rm -rf dist` to the start of the build script in package.json, or run
      `vite build --emptyOutDir` (which is default). Add `prerender.mjs` cleanup per
      shard-config cfg-016.
    effort: trivial
    consolidates: [shard-config cfg-016]

# Cross-shard summary
# -------------------
# Severity rollup after dedup:
#   P0: 4  (security headers; react-router CVE; modal a11y; submit contract gap)
#   P1: 7
#   P2: 3
#   P3: from individual shards, not consolidated (~5 nits)
#
# Top 3 root causes
# 1. **No infrastructure-as-config for security**: no CSP, no HSTS, no CI, no a11y/security
#    lint rules, no tests. Single fix: stand up CI + headers policy + lint plugins (~1 day work
#    that retires fe-p25-001, -008, -009, -013).
# 2. **Submit pipeline is fire-and-forget**: FE never reads response, never polls, never
#    surfaces errors. Pairs with backend audit's auth/payload gaps. Fix: implement polling
#    + Zod validation + visible error UI (retires cs-001, -004, -005, fe-p25-004, fe-p25-007e).
# 3. **Modal infrastructure missing**: no shared dialog primitive. Every popup re-implements
#    badly. Single shared <Modal/> + dependency on a focus-trap library closes 4+ a11y P0/P1.
#
# Cross-stack hooks (feed Phase D)
# - fe-p25-001 (CSP) + BE auth gap p25-001 → no defence-in-depth on the public attack surface
# - fe-p25-004 + BE p25-002 (taint trace) → unbounded payload accepted blindly on both sides
# - fe-p25-006 + BE p25-010 (dual-layer CORS) → env wiring drift across stacks
#
# Items NOT consolidated (kept in per-shard YAML, see individual files)
# - 12 ESLint `any` violations in MappingTool (process — lint should fail PRs)
# - color contrast warnings (a11y-011) need live Lighthouse run to confirm
# - 5 P3 nits from shard-config (rollback, logging, etc.)
